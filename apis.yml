aid: happytal
name: Happytal
description: 'Happytal is a French healthtech and services company founded in 2013 and
  acquired by La Poste Group''s health division (La Poste Santé) in 2022. It operates a
  hospital concierge service (conciergerie hospitalière) that combines a digital platform
  with on-site human concierges to simplify the administrative, medical and hotel journey
  of each patient. Services include in-room delivery, a comfort-products marketplace,
  private-room and admission paperwork assistance, and support for patients, their
  families and hospital staff across French healthcare establishments, alongside
  elder-care/EHPAD offerings and the careside.care business-to-business product for
  care facilities. Happytal exposes no public developer API; this profile is maintained
  in the API Evangelist network as a company record enriched from public sources.'
